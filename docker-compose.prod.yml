# Production docker-compose for Raspberry Pi (or any server)
# Uses pre-built images from GitHub Container Registry (ghcr.io)
# instead of building from source.
#
# Configuration comes from a single .env next to this file (see .env.example);
# compose loads it automatically. EYE_VERSION pins the image tag (vX.Y.Z) so
# a deploy can be rolled back; unset means :latest.
#
# Deploy a tagged release on the Pi: scripts/deploy-pi.sh [vX.Y.Z]
# Manual equivalent:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

# Compose project name. Without it the project takes the parent folder name
# ("projects" on the Pi). Changing it creates new containers, network and
# volume (eye_postgres_data): the database starts empty.
name: eye

services:
  postgres:
    image: postgres:15-alpine
    container_name: eye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eye_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-__SET_POSTGRES_PASSWORD__}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # host only: was open to every LAN subnet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d eye_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - services
    mem_limit: 1024m
    cpus: "1.0"

  api:
    image: ghcr.io/wannabexaker/eye-api:${EYE_VERSION:-latest}
    container_name: eye-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3200
      DATABASE_URL: postgresql://app_user:${POSTGRES_PASSWORD}@postgres:5432/eye_db
      # Keys the session/reset token hashes. Empty falls back to an insecure dev
      # default in the API, so set it in .env on every real deployment.
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3100,http://player-web:3000,http://admin-web:3100}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      PLAYER_SEED_EMAIL: ${PLAYER_SEED_EMAIL:-}
      PLAYER_SEED_PASSWORD: ${PLAYER_SEED_PASSWORD:-}
      AUTH_MODE: ${AUTH_MODE:-INTERNAL_ONLY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      RG_TOOLS_ENABLED: ${RG_TOOLS_ENABLED:-false}
      PROVABLY_FAIR_ENABLED: ${PROVABLY_FAIR_ENABLED:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./data/analytics:/app/data/analytics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - services
    mem_limit: 512m
    cpus: "0.5"

  player-web:
    image: ghcr.io/wannabexaker/eye-player-web:${EYE_VERSION:-latest}
    container_name: eye-player-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Docker sets HOSTNAME to the container id; Next standalone would then
      # listen only on the container IP and the localhost healthcheck fails.
      HOSTNAME: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}
      API_INTERNAL_URL: http://api:3200
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3200}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - services
    mem_limit: 768m
    cpus: "1.0"

  admin-web:
    image: ghcr.io/wannabexaker/eye-admin-web:${EYE_VERSION:-latest}
    container_name: eye-admin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Docker sets HOSTNAME to the container id; Next standalone would then
      # listen only on the container IP and the localhost healthcheck fails.
      HOSTNAME: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3100
      API_INTERNAL_URL: http://api:3200
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3200}
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    networks:
      - services
    mem_limit: 512m
    cpus: "0.5"

networks:
  services:
    driver: bridge

volumes:
  postgres_data:
    driver: local
